<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iskolatörténeti Műszerek és Bemutatóeszközök</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Laboratóriumi és gyakorlaton alkalmazott műszerek, bemutatóeszközök iskolánk múltjából</h1>
        </header>

        <div class="controls">
            <div class="search-wrapper">
                <input type="text" id="searchInput" class="search-input"
                    placeholder="Műszer, gyártó vagy évszám keresése...">
            </div>

            <div class="filter-tags">
                <button class="tag-btn active" data-filter="all">Összes eszköz</button>
                <button class="tag-btn" data-filter="elektro">Elektrotechnika & Elektronika</button>
                <button class="tag-btn" data-filter="fizika">Fizika & Optika</button>
                <button class="tag-btn" data-filter="gepeszet">Gépészet & Modellek</button>
                <button class="tag-btn" data-filter="egyeb">Egyéb & Iskolatörténet</button>
            </div>
        </div>

        <div id="instrumentList" class="instrument-list"></div>
        <div id="noResults" class="no-results">Nincs a keresésnek megfelelő eszköz.</div>
    </div>
    <div id="instrumentModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>

            <div class="modal-image-container">
                <img id="modalImage" class="modal-image">
            </div>

            <h2 id="modalTitle"></h2>

            <div class="modal-meta">
                <p><strong>Gyártó:</strong> <span id="modalManufacturer"></span></p>
                <p><strong>Korszak:</strong> <span id="modalYear"></span></p>
                <p><strong>Kategória:</strong> <span id="modalCategory"></span></p>
                <p><strong>Hely:</strong> <span id="modalLocation"></span></p>
            </div>

            <p id="modalDescription"></p>
        </div>
    </div>
    <script src="assets/js/app.js"></script>
</body>

</html>
